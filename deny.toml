# cargo-deny: dependency licenses, security advisories and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Calcine ships for Windows ARM64 today, Linux ARM64 next.
targets = ["aarch64-pc-windows-msvc", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices only fail for our direct
# dependencies: transitive ones (e.g. `paste` via specta, GTK's
# `proc-macro-error` via Tauri on Linux) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses compatible with distributing Calcine under MIT.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
